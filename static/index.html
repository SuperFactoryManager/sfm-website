<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Super Factory Manager</title>
    <meta name="description" content="Super Factory Manager content portal">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="page">
      <header class="masthead">
        <h1>Super Factory Manager</h1>
        <nav class="section-nav" aria-label="Sections">
          <a href="#about">About</a>
          <a href="#learn">Learn</a>
          <a href="#watch">Watch</a>
          <a href="#legacy">Legacy</a>
        </nav>
      </header>

      <section class="content-section" id="about">
        <div class="section-heading">
          <h2>About</h2>
          <span class="count" data-count-for="about">0</span>
        </div>
        <div class="content-grid" data-category="about"></div>
      </section>

      <section class="content-section" id="learn">
        <div class="section-heading">
          <h2>Learn</h2>
          <span class="count" data-count-for="learn">0</span>
        </div>
        <div class="content-grid" data-category="learn"></div>
      </section>

      <section class="content-section" id="watch">
        <div class="section-heading">
          <h2>Watch</h2>
          <span class="count" data-count-for="watch">0</span>
        </div>
        <div class="content-grid" data-category="watch"></div>
      </section>

      <section class="content-section" id="legacy">
        <div class="section-heading">
          <h2>Legacy</h2>
          <span class="count" data-count-for="legacy">0</span>
        </div>
        <div class="content-grid" data-category="legacy"></div>
      </section>
    </main>

    <template id="item-template">
      <article class="item">
        <div class="item-main">
          <a class="item-link" target="_blank" rel="noreferrer"></a>
          <div class="item-meta"></div>
        </div>
        <ul class="tag-list"></ul>
      </article>
    </template>

    <script>
      const categoryLabels = {
        about: "About",
        learn: "Learn",
        watch: "Watch",
        legacy: "Legacy"
      };

      function renderTags(item, currentCategory) {
        const tags = [
          item.kind,
          item.source,
          item.era,
          ...item.categories.filter((category) => category !== currentCategory).map((category) => categoryLabels[category]),
          ...item.tags
        ].filter(Boolean);

        return [...new Set(tags)];
      }

      function renderItem(item, currentCategory) {
        const template = document.getElementById("item-template");
        const fragment = template.content.cloneNode(true);
        const link = fragment.querySelector(".item-link");
        const meta = fragment.querySelector(".item-meta");
        const tagList = fragment.querySelector(".tag-list");

        link.textContent = item.title;
        link.href = item.url;
        link.dataset.itemId = item.id;
        link.dataset.category = currentCategory;

        meta.textContent = [item.creator, item.language].filter(Boolean).join(" / ");

        for (const tag of renderTags(item, currentCategory)) {
          const li = document.createElement("li");
          li.textContent = tag;
          tagList.appendChild(li);
        }

        return fragment;
      }

      fetch("./data/content.json")
        .then((response) => response.json())
        .then((items) => {
          for (const category of Object.keys(categoryLabels)) {
            const sectionItems = items
              .filter((item) => item.categories.includes(category))
              .sort((a, b) => a.weight - b.weight || a.title.localeCompare(b.title));

            const container = document.querySelector(`[data-category="${category}"]`);
            const count = document.querySelector(`[data-count-for="${category}"]`);
            count.textContent = sectionItems.length;

            for (const item of sectionItems) {
              container.appendChild(renderItem(item, category));
            }
          }
        })
        .catch(() => {
          document.body.insertAdjacentHTML(
            "beforeend",
            "<div class=\"load-error\">content.json failed to load</div>"
          );
        });
    </script>
  </body>
</html>
